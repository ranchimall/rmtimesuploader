    <script>
        // =========================================================================
        // 1. SUPERNODE CONFIGURATION
        // =========================================================================
        const supernodesList = {
            "FQUepiEXu4zhEtENqLA8RXdidXYiCUPeuc": {
                uri: "ranchimallcloud1.duckdns.org",
                pubKey: "03A0AD65FFBB8CAE0316BC93EE2BD6BDDF3A47970C2D550E4E1C7DFC559F131EA2"
            },
            "FBjW246c4VT9KC4p5CLsEjd7gMGcaFWBov": {
                uri: "ranchimallcloud0.duckdns.org",
                pubKey: "03DABC832B95F088CA88F87D154B73B415F085945CFF3D4C36DCE081518D229B31"
            }
        };

        // =========================================================================
        // 2. ENDPOINTS CONFIGURATION
        // =========================================================================
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/isgumel2/image/upload";
        const CLOUDINARY_PRESET = "rmtimes";

        const GDRIVE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxKJQ0P47iQ6hBLY9hHxLiNAOyFtbatyR7WMTP517U9F85BGu1PVFuypqtj5QaxaowH/exec";

        // =========================================================================
        // 3. UTILITY HELPERS
        // =========================================================================
        function calculateReadTime(text) {
            const wordsPerMinute = 200;
            const words = text ? text.trim().split(/\s+/).length : 0;
            return Math.ceil(words / wordsPerMinute);
        }

        function parseContributors(rawInput, myFloID) {
            const contributors = [myFloID];

            if (rawInput && rawInput.trim() !== "") {
                const entries = rawInput.split(",").map(s => s.trim()).filter(s => s !== "");
                const alphanumericPattern = /^[a-zA-Z0-9]+$/;

                for (const entry of entries) {
                    if (!alphanumericPattern.test(entry)) {
                        alert(`"${entry}" is not valid — contributors must be alphanumeric only. It will be skipped.`);
                        continue;
                    }
                    if (!contributors.includes(entry)) {
                        contributors.push(entry);
                    }
                }
            }

            return contributors;
        }

        function logToScreen(message) {
            const logElement = document.getElementById("logOutput");
            logElement.style.display = "block";
            logElement.textContent += message + "\n";
            logElement.scrollTop = logElement.scrollHeight;
        }

        function getMimeType(filename) {
            const ext = (filename.match(/\.[a-zA-Z0-9]+$/) || [""])[0].toLowerCase();
            if (ext === ".jpg" || ext === ".jpeg") return "image/jpeg";
            if (ext === ".gif") return "image/gif";
            if (ext === ".webp") return "image/webp";
            if (ext === ".svg") return "image/svg+xml";
            return "image/png";
        }

        function bytesToBase64(bytes) {
            let binary = "";
            const chunkSize = 0x8000;
            for (let i = 0; i < bytes.length; i += chunkSize) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
            }
            return btoa(binary);
        }

        // =========================================================================
        // 4. IN-BROWSER DOCX -> ARTICLE CONVERTER
        // =========================================================================
        const OOXML_NS = {
            w:   "http://schemas.openxmlformats.org/wordprocessingml/2006/main",
            r:   "http://schemas.openxmlformats.org/officeDocument/2006/relationships",
            a:   "http://schemas.openxmlformats.org/drawingml/2006/main",
            wp:  "http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing",
            rel: "http://schemas.openxmlformats.org/package/2006/relationships",
            dc:  "http://purl.org/dc/elements/1.1/"
        };

        const GITHUB_OWNER = "ranchimall";
        const GITHUB_REPO = "rmtimes";
        const GITHUB_BRANCH = "imageinsidearticle";
        const GITHUB_REPO_IMAGE_PATH = "images";
        const GITHUB_IMAGE_BASE_URL = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${GITHUB_REPO_IMAGE_PATH}/`;
        const DEFAULT_IMAGE_WIDTH = 800;

        const HEURISTIC_MAX_WORDS = 12;
        const SENTENCE_ENDINGS = [".", "!", "?", ":", ";", ","];
        const NUMBERED_HEADING_MIN_MATCHES = 2;
        const NUMBERED_HEADING_RE = /^\d+(\.\d+)*\.?\s+\S/;

        const TABLE_STYLE_BLOCK = `<style>
        .rmtimes-table-wrap {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }
        .rmtimes-table-wrap table {
            width: max-content;
            min-width: 100%;
            table-layout: auto;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        .rmtimes-table-wrap th,
        .rmtimes-table-wrap td {
            white-space: normal;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        .rmtimes-table-wrap th {
            background-color: #222;
            color: white;
            text-align: left;
            padding: 10px;
        }
        .rmtimes-table-wrap td {
            padding: 10px;
            border-bottom: 1px solid #ccc;
            vertical-align: top;
        }
        .rmtimes-table-wrap tr:nth-child(even) {
            background-color: #f5f5f5;
        }
        @media (max-width: 480px) {
            .rmtimes-table-wrap th,
            .rmtimes-table-wrap td {
                padding: 6px 8px;
                font-size: 0.85rem;
            }
        }
    </style>`;

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function directChildren(el, ns, local) {
            return Array.from(el.children).filter(c => c.namespaceURI === ns && c.localName === local);
        }

        function parseXml(xmlString, label) {
            const doc = new DOMParser().parseFromString(xmlString, "application/xml");
            const err = doc.getElementsByTagName("parsererror")[0];
            if (err) throw new Error(`Failed to parse ${label}: ${err.textContent.slice(0, 200)}`);
            return doc;
        }

        function getParagraphText(pEl) {
            let text = "";
            (function walk(node) {
                for (const child of node.childNodes) {
                    if (child.nodeType !== 1) continue;
                    const local = child.localName;
                    if (child.namespaceURI === OOXML_NS.w && local === "t") {
                        text += child.textContent;
                    } else if (child.namespaceURI === OOXML_NS.w && local === "tab") {
                        text += "\t";
                    } else if (child.namespaceURI === OOXML_NS.w && (local === "br" || local === "cr")) {
                        text += " ";
                    } else {
                        walk(child);
                    }
                }
            })(pEl);
            return text;
        }

        function looksLikeNumberedHeading(text) {
            return NUMBERED_HEADING_RE.test(text.trim());
        }

        function looksLikeHeadingText(text) {
            const words = text.split(/\s+/).filter(Boolean);
            if (!words.length || words.length > HEURISTIC_MAX_WORDS) return false;
            const trimmed = text.trim();
            return !SENTENCE_ENDINGS.includes(trimmed.slice(-1));
        }

        function findExtent(blipEl) {
            let node = blipEl.parentElement;
            while (node) {
                const extent = directChildren(node, OOXML_NS.wp, "extent")[0];
                if (extent) return extent;
                node = node.parentElement;
            }
            return null;
        }

        function renderTableBlock(tblEl) {
            const rows = directChildren(tblEl, OOXML_NS.w, "tr");
            const rowsHtml = rows.map((row, i) => {
                const tag = i === 0 ? "th" : "td";
                const cells = directChildren(row, OOXML_NS.w, "tc");
                const cellsHtml = cells.map(cell => {
                    const paras = directChildren(cell, OOXML_NS.w, "p");
                    const parts = paras
                        .map(p => getParagraphText(p).trim())
                        .filter(Boolean)
                        .map(escapeHtml);
                    return `<${tag}>${parts.join("<br>")}</${tag}>`;
                }).join("\n        ");
                return `    <tr>\n        ${cellsHtml}\n    </tr>`;
            });
            const tableHtml = `<div class="rmtimes-table-wrap">\n<table>\n${rowsHtml.join("\n")}\n</table>\n</div>`;
            return TABLE_STYLE_BLOCK + "\n" + tableHtml;
        }

        function renderContentHtml(sections) {
            const blocksOut = [];
            for (const section of sections) {
                const lines = [];
                if (section.title !== null) {
                    lines.push(`<h3>${escapeHtml(section.title)}</h3>`);
                    for (const block of section.blocks) {
                        if (block.kind === "text") lines.push(`<p>${escapeHtml(block.content)}</p>`);
                        else lines.push(`<p>${block.content}</p>`);
                    }
                } else {
                    let textRun = [];
                    const flushTextRun = () => {
                        if (textRun.length) {
                            const joined = textRun.join(" ").trim();
                            if (joined) lines.push(`<p>${escapeHtml(joined)}</p>`);
                            textRun = [];
                        }
                    };
                    for (const block of section.blocks) {
                        if (block.kind === "text") {
                            textRun.push(block.content);
                        } else {
                            flushTextRun();
                            lines.push(`<p>${block.content}</p>`);
                        }
                    }
                    flushTextRun();
                }
                if (lines.length) blocksOut.push(lines.join("\n"));
            }
            return blocksOut.join("\n\n").trim();
        }

        function normalizeForCompare(text) {
            return text.trim().replace(/\s+/g, " ").toLowerCase();
        }

        async function convertDocxFile(file) {
            const zip = await JSZip.loadAsync(file);

            const docEntry = zip.file("word/document.xml");
            if (!docEntry) throw new Error("Not a valid .docx: word/document.xml not found.");
            const docXml = parseXml(await docEntry.async("string"), "word/document.xml");

            const relsEntry = zip.file("word/_rels/document.xml.rels");
            const relsXml = parseXml(
                relsEntry ? await relsEntry.async("string") : '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"/>',
                "document.xml.rels"
            );

            const stylesEntry = zip.file("word/styles.xml");
            const stylesXml = parseXml(
                stylesEntry ? await stylesEntry.async("string") : `<w:styles xmlns:w="${OOXML_NS.w}"/>`,
                "styles.xml"
            );

            const coreEntry = zip.file("docProps/core.xml");
            const coreXml = coreEntry ? parseXml(await coreEntry.async("string"), "core.xml") : null;

            const styleMap = {};
            for (const styleEl of Array.from(stylesXml.getElementsByTagNameNS(OOXML_NS.w, "style"))) {
                if (styleEl.getAttributeNS(OOXML_NS.w, "type") !== "paragraph") continue;
                const id = styleEl.getAttributeNS(OOXML_NS.w, "styleId");
                const nameEl = directChildren(styleEl, OOXML_NS.w, "name")[0];
                const nameVal = nameEl ? (nameEl.getAttributeNS(OOXML_NS.w, "val") || "").toLowerCase() : "";
                if (id) styleMap[id] = nameVal;
            }

            function getParaStyleName(p) {
                const pPr = directChildren(p, OOXML_NS.w, "pPr")[0];
                if (!pPr) return "";
                const pStyle = directChildren(pPr, OOXML_NS.w, "pStyle")[0];
                if (!pStyle) return "";
                const id = pStyle.getAttributeNS(OOXML_NS.w, "val");
                return styleMap[id] || "";
            }
            const hasHeadingStyle = p => getParaStyleName(p).startsWith("heading");
            const isTitleStyle = p => getParaStyleName(p) === "title";
            const isHeading = p => hasHeadingStyle(p) || isTitleStyle(p);

            const relsMap = {};
            for (const relEl of Array.from(relsXml.getElementsByTagNameNS(OOXML_NS.rel, "Relationship"))) {
                relsMap[relEl.getAttribute("Id")] = relEl.getAttribute("Target");
            }

            let coreTitle = "";
            if (coreXml) {
                const titleEls = coreXml.getElementsByTagNameNS(OOXML_NS.dc, "title");
                if (titleEls.length) coreTitle = (titleEls[0].textContent || "").trim();
            }

            const body = docXml.getElementsByTagNameNS(OOXML_NS.w, "body")[0];
            if (!body) throw new Error("Not a valid .docx: <w:body> not found.");
            const bodyParagraphs = directChildren(body, OOXML_NS.w, "p");

            const hasRealHeadings = bodyParagraphs.some(p => getParagraphText(p).trim() && hasHeadingStyle(p));
            let headingMode;
            if (hasRealHeadings) {
                headingMode = "style";
            } else {
                const numberedCount = bodyParagraphs.filter(p => {
                    const t = getParagraphText(p).trim();
                    return t && looksLikeNumberedHeading(t);
                }).length;
                headingMode = numberedCount >= NUMBERED_HEADING_MIN_MATCHES ? "numbered" : "heuristic";
            }

            const docxStem = file.name.replace(/\.docx$/i, "");
            let title = null;
            for (const p of bodyParagraphs) {
                const t = getParagraphText(p).trim();
                if (t && isTitleStyle(p)) { title = t; break; }
            }
            if (!title) title = coreTitle || docxStem;

            const sections = [];
            let current = null;
            let imageCounter = 0;
            const extractedImages = [];

            const titleWords = normalizeForCompare(title).split(" ").filter(Boolean);
            let titleWordsConsumed = 0;
            let titleRepeatOpen = titleWords.length > 0;

            function ensureCurrent() {
                if (!current) { current = { title: null, blocks: [] }; sections.push(current); }
                return current;
            }

            for (const child of Array.from(body.children)) {
                if (child.namespaceURI === OOXML_NS.w && child.localName === "p") {
                    const p = child;
                    const text = getParagraphText(p).trim();

                    let alt = "";
                    for (const d of Array.from(p.getElementsByTagNameNS(OOXML_NS.wp, "docPr"))) {
                        const descr = (d.getAttribute("descr") || "").trim();
                        if (descr) { alt = descr; break; }
                    }
                    if (!alt) alt = "Article image";

                    for (const blip of Array.from(p.getElementsByTagNameNS(OOXML_NS.a, "blip"))) {
                        const rId = blip.getAttributeNS(OOXML_NS.r, "embed");
                        const target = rId ? relsMap[rId] : null;
                        if (!target) continue;

                        const zipPath = "word/" + target.replace(/^\.?\/+/, "");
                        const imgEntry = zip.file(zipPath);
                        if (!imgEntry) continue;
                        const bytes = await imgEntry.async("uint8array");

                        const extMatch = target.match(/\.[a-zA-Z0-9]+$/);
                        const ext = extMatch ? extMatch[0].toLowerCase() : ".png";

                        imageCounter += 1;
                        const filename = `${docxStem}_img${imageCounter}${ext}`;

                        const extentEl = findExtent(blip);
                        let widthPx = DEFAULT_IMAGE_WIDTH;
                        if (extentEl) {
                            const cx = parseInt(extentEl.getAttribute("cx"), 10);
                            if (!isNaN(cx)) widthPx = Math.round((cx / 914400) * 96);
                        }
                        widthPx = Math.min(widthPx, DEFAULT_IMAGE_WIDTH);

                        const placeholderUrl = GITHUB_IMAGE_BASE_URL + filename;
                        extractedImages.push({ filename, bytes, placeholderUrl });

                        ensureCurrent().blocks.push({
                            kind: "image",
                            content: `<img src="${placeholderUrl}"\n     alt="${escapeHtml(alt)}"\n     width="${widthPx}"\n     loading="lazy">`
                        });
                    }

                    if (!text) continue;

                    if (titleRepeatOpen) {
                        const paraWords = normalizeForCompare(text).split(" ").filter(Boolean);
                        const n = paraWords.length;
                        const nextChunk = titleWords.slice(titleWordsConsumed, titleWordsConsumed + n);
                        const matchesNextChunk = n > 0 && nextChunk.length === n && nextChunk.every((w, i) => w === paraWords[i]);

                        if (matchesNextChunk) {
                            titleWordsConsumed += n;
                            if (titleWordsConsumed >= titleWords.length) titleWordsConsumed = 0;
                            continue;
                        } else if (isTitleStyle(p)) {
                            titleWordsConsumed = 0;
                            continue;
                        } else {
                            titleRepeatOpen = false;
                        }
                    }

                    let heading;
                    if (headingMode === "numbered") heading = isHeading(p) || looksLikeNumberedHeading(text);
                    else if (headingMode === "heuristic") heading = isHeading(p) || looksLikeHeadingText(text);
                    else heading = isHeading(p);

                    if (heading) {
                        current = { title: text, blocks: [] };
                        sections.push(current);
                        continue;
                    }

                    ensureCurrent().blocks.push({ kind: "text", content: text });

                } else if (child.namespaceURI === OOXML_NS.w && child.localName === "tbl") {
                    ensureCurrent().blocks.push({ kind: "table", content: renderTableBlock(child) });
                }
            }

            const content = renderContentHtml(sections);
            const readTime = calculateReadTime(content);

            return { title, content, readTime, extractedImages, headingMode };
        }

        // --- GITHUB UPLOADER (SUBADMIN MODE) ---
        async function githubCheckSha(repoPath, token) {
            const res = await fetch(
                `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${repoPath}?ref=${GITHUB_BRANCH}`,
                { headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } }
            );
            if (res.status === 404) return null;
            if (!res.ok) throw new Error(`GitHub check failed for ${repoPath}: ${res.status}`);
            const data = await res.json();
            return data.sha || null;
        }

        // --- CLOUDINARY UPLOADER (GENERAL USER PRIMARY) ---
        async function cloudinaryUploadFile(bytes, filename) {
            const mimeType = getMimeType(filename);
            const blob = new Blob([bytes], { type: mimeType });
            const fd = new FormData();
            fd.append("file", blob, filename);
            fd.append("upload_preset", CLOUDINARY_PRESET);

            }
            return data.secure_url;
        }

        // =========================================================================
        // PROOF OF WORK (ANTI-SPAM) SYSTEM
        // =========================================================================
        const powWorkerScript = `
        function hasLeadingZeroBits(uint8Array, bits) {
            const fullBytes = Math.floor(bits / 8);
            const remainingBits = bits % 8;

            for (let i = 0; i < fullBytes; i++) {
                if (uint8Array[i] !== 0) return false;
            }

            if (remainingBits > 0) {
                const mask = (0xFF << (8 - remainingBits)) & 0xFF;
                if ((uint8Array[fullBytes] & mask) !== 0) return false;
            }

            return true;
        }

        self.onmessage = async function(e) {
            const { floAddress, articleHash, challenge, targetZeroBits } = e.data;
            const textEncoder = new TextEncoder();
            const prefixString = floAddress + articleHash + challenge;

            let nonce = 0;
            const startTime = Date.now();
            let lastReportTime = startTime;

            while (true) {
                const input = textEncoder.encode(prefixString + nonce);
                const hashBuffer = await crypto.subtle.digest('SHA-256', input);
                const hashArray = new Uint8Array(hashBuffer);

                if (hasLeadingZeroBits(hashArray, targetZeroBits)) {
                    const durationMs = Date.now() - startTime;
                    const hashHex = Array.from(hashArray).map(b => b.toString(16).padStart(2, '0')).join('');
                    self.postMessage({
                        success: true,
                        nonce: nonce,
                        hash: hashHex,
                        durationMs: durationMs,
                        totalHashes: nonce + 1
                    });
                    break;
                }

                nonce++;

                const now = Date.now();
                if (now - lastReportTime > 200) {
                    lastReportTime = now;
                    self.postMessage({
                        progress: true,
                        hashesComputed: nonce,
                        ratePerSec: Math.round((nonce / ((now - startTime) / 1000))),
                        elapsedSec: ((now - startTime) / 1000).toFixed(1)
                    });
                }
            }
        };
        `;

        function updateUserProgressCard(options) {
            const card = document.getElementById("userProgressCard");
            const titleEl = document.getElementById("progressTitle");

        async function runProofOfWork(floAddress, articleTitle, articleContent, difficultyBits = 22) {
            const textBytes = new TextEncoder().encode(articleTitle + articleContent);
            const articleHashBuffer = await crypto.subtle.digest('SHA-256', textBytes);
            const articleHash = Array.from(new Uint8Array(articleHashBuffer))
                .map(b => b.toString(16).padStart(2, '0')).join('');

            const challenge = crypto.randomUUID();

            const blob = new Blob([powWorkerScript], { type: 'application/javascript' });
            const workerUrl = URL.createObjectURL(blob);
            const worker = new Worker(workerUrl);

            return new Promise((resolve, reject) => {
                logToScreen(`[PoW] Computing Proof of Work (Anti-Spam Verification)...`);
                logToScreen(`  ├─ FLO Address: ${floAddress}`);
                logToScreen(`  ├─ Challenge UUID: ${challenge}`);
                logToScreen(`  └─ Difficulty: ${difficultyBits} zero bits`);

                updateUserProgressCard({
                    title: "Computing Proof of Work (Anti-Spam Verification: 0.0s)",
                    subtext: "Calculating cryptographic proof...",
                    percent: 10,
                    spinner: true
                });

                worker.onmessage = function(e) {
                    if (e.data.progress) {
                        const elapsedSec = e.data.elapsedSec || "0.0";
                        logToScreen(`  [PoW Working] ${e.data.hashesComputed.toLocaleString()} hashes computed (${(e.data.ratePerSec / 1000).toFixed(1)}k hash/sec)`);
                        updateUserProgressCard({
                            title: `Computing Proof of Work (Anti-Spam Verification: ${elapsedSec}s...)`,
                            subtext: `Verified ${e.data.hashesComputed.toLocaleString()} hashes (${(e.data.ratePerSec / 1000).toFixed(1)}k hash/sec)`,
                            percent: Math.min(80, Math.round((e.data.hashesComputed / 4194304) * 100))
                        });
                    } else if (e.data.success) {
                        const sec = (e.data.durationMs / 1000).toFixed(2);
                        logToScreen(`✓ [PoW Completed] Solved in ${sec}s (${e.data.totalHashes.toLocaleString()} hashes, Nonce: ${e.data.nonce})`);
                        logToScreen(`  └─ Valid Hash: ${e.data.hash}`);

                        updateUserProgressCard({
                            title: "✓ Hash verification completed",
                            subtext: `Proof of Work solved in ${sec}s! Now uploading your article...`,
                            percent: 85
                        });

                        worker.terminate();
                        URL.revokeObjectURL(workerUrl);

                        resolve({
                            challenge: challenge,
                            nonce: e.data.nonce,
                            hash: e.data.hash,
                            difficulty: difficultyBits,
                            durationSec: parseFloat(sec)
                        });
                    }
                };

                worker.onerror = function(err) {
                    worker.terminate();
                    URL.revokeObjectURL(workerUrl);
                    reject(new Error("PoW Worker Error: " + err.message));
                };

                worker.postMessage({
                    floAddress: floAddress,
                    articleHash: articleHash,
                    challenge: challenge,
                    targetZeroBits: difficultyBits
                });
            });
        }

        // --- GOOGLE DRIVE / APPS SCRIPT REGISTRY & UPLOADER (GENERAL USER MODE) ---
        async function calculateSha256Hex(bytes) {
            const hashBuffer = await crypto.subtle.digest("SHA-256", bytes);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, "0")).join("");
        }

        async function processHeroImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = async () => {
                    try {
                        URL.revokeObjectURL(url);

                        // 1. Center-crop & Resize to 800 x 450 px (16:9 Aspect Ratio)
                        const mainCanvas = document.createElement("canvas");
                        mainCanvas.width = 800;
                        mainCanvas.height = 450;
                        const mainCtx = mainCanvas.getContext("2d");

                        const targetAspect = 800 / 450;
                        const imgAspect = img.width / img.height;
                        let sx = 0, sy = 0, sWidth = img.width, sHeight = img.height;

                        if (imgAspect > targetAspect) {
                            sWidth = img.height * targetAspect;
                            sx = (img.width - sWidth) / 2;
                        } else {
                            sHeight = img.width / targetAspect;
                            sy = (img.height - sHeight) / 2;
                        }

                        mainCtx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, 800, 450);
                        const mainBlob = await new Promise(res => mainCanvas.toBlob(res, "image/jpeg", 0.90));
                        const mainBytes = new Uint8Array(await mainBlob.arrayBuffer());

                        // 2. Generate Thumbnail (400 x 225 px, Guaranteed < 100 KB)
                        const thumbCanvas = document.createElement("canvas");
                        thumbCanvas.width = 400;
                        thumbCanvas.height = 225;
                        const thumbCtx = thumbCanvas.getContext("2d");
                        thumbCtx.drawImage(img, sx, sy, sWidth, sHeight, 0, 0, 400, 225);

                        let quality = 0.85;
                        let thumbBlob = await new Promise(res => thumbCanvas.toBlob(res, "image/jpeg", quality));

                        // Dynamically reduce JPEG quality if size > 100 KB (102,400 bytes)
                        while (thumbBlob.size > 102400 && quality > 0.30) {
                            quality -= 0.10;
                            thumbBlob = await new Promise(res => thumbCanvas.toBlob(res, "image/jpeg", quality));
                        }

                        const thumbBytes = new Uint8Array(await thumbBlob.arrayBuffer());

                        resolve({
                            mainBytes,
                            thumbBytes,
                            mainSizeKb: Math.round(mainBlob.size / 1024),
                            thumbSizeKb: Math.round(thumbBlob.size / 1024)
                        });
                    } catch (err) {
                        reject(err);
                    }
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error("Failed to load hero image for processing."));
                };
                img.src = url;
            });
        }

        function getLocalRegistry() {
            try {
                const stored = localStorage.getItem("rmtimes_image_registry");
                return stored ? JSON.parse(stored) : {};
            } catch (e) {
                return {};
            }
        }

        function saveLocalRegistryEntry(hash, filename, cloudinaryUrl, gdriveUrl) {
            try {
                const registry = getLocalRegistry();
                const existing = registry[hash] || {};
                registry[hash] = {
                    filename: filename,
                    firstUploaded: existing.firstUploaded || new Date().toISOString(),
                    lastReused: new Date().toISOString(),
                    usageCount: (existing.usageCount || 1) + (existing.firstUploaded ? 1 : 0),
                    providers: {
                        cloudinary: cloudinaryUrl || existing.providers?.cloudinary || "",
                        gdrive: gdriveUrl || existing.providers?.gdrive || ""
                    }
                };
                localStorage.setItem("rmtimes_image_registry", JSON.stringify(registry));
            } catch (e) {
                console.warn("Failed to save local registry entry:", e);
            }
        }

        async function checkGoogleDriveRegistry(imageHash) {
            // 1. Check Local Browser Cache First
            const localRegistry = getLocalRegistry();
            if (localRegistry[imageHash]) {
                const entry = localRegistry[imageHash];
                entry.usageCount = (entry.usageCount || 1) + 1;
                entry.lastReused = new Date().toISOString();
                try {
                    localStorage.setItem("rmtimes_image_registry", JSON.stringify(localRegistry));
                } catch (e) {}

                return {
                    exists: true,
                    source: "localCache",
                    hash: imageHash,
                    primaryUrl: entry.providers?.cloudinary || "",
                    fallbackUrl: entry.providers?.gdrive || "",
                    usageCount: entry.usageCount,
                    providers: entry.providers
                };
            }

            // 2. Query Google Drive Apps Script Server Registry
            try {
                const res = await fetch(GDRIVE_APPS_SCRIPT_URL, {
                    method: "POST",
                    redirect: "follow",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        action: "checkHash",
                        hash: imageHash
                    })
                });

                if (res.ok) {
                    const data = await res.json();
                    if (data && data.exists) {
                        data.source = "serverRegistry";
                        saveLocalRegistryEntry(imageHash, data.filename || "image", data.primaryUrl, data.fallbackUrl);
                        return data;
                    }
                    if (data && data.error) {
                        console.warn("Apps Script registry check returned error:", data.error);
                    }
                }
            } catch (err) {
                console.warn("Server registry check error:", err);
            }

            return { exists: false };
        }

        async function googleDriveAppsScriptUpload(bytes, filename, imageHash, cloudinaryUrl) {
            const mimeType = getMimeType(filename);
            const base64Data = bytesToBase64(bytes);

            const res = await fetch(GDRIVE_APPS_SCRIPT_URL, {
                method: "POST",
                redirect: "follow",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({
                    action: "upload",
                    fileName: filename,
                    mimeType: mimeType,
                    base64: base64Data,
                    hash: imageHash || "",
                    cloudinaryUrl: cloudinaryUrl || ""
                })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(`Google Drive upload failed (${res.status}): ${errText.slice(0, 200)}`);
            }

            const data = await res.json();
            if (!data.success || !data.url) {
                throw new Error(data.error || "Google Drive upload failed or missing URL.");
            }

            if (imageHash) {
                saveLocalRegistryEntry(imageHash, filename, cloudinaryUrl, data.url);
            }

            return data.url;
        }

                        const githubToken = prompt(
                            `This article has ${pendingImages.length} image(s) to upload to GitHub ` +
                            `(${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${GITHUB_REPO_IMAGE_PATH}). ` +
                            `Enter a GitHub token with 'contents: write' access:`
                        );

                        if (!githubToken) {
                            const proceedAnyway = confirm(
                                "No GitHub token entered -- images will NOT be uploaded and their links " +
                                "will be broken in the published article. Publish anyway?"
                            );
                            if (!proceedAnyway) {
                                logToScreen("[System] Publishing canceled: GitHub token not provided.");
                                return;
                            }
                            logToScreen("[Warning] Skipping GitHub image upload; image links may be broken.");
                        } else {
                            logToScreen(`[System] Processing ${pendingImages.length} image(s) for GitHub...`);
                            let failures = 0;
                            for (const img of pendingImages) {
                                try {
                                    const repoPath = `${GITHUB_REPO_IMAGE_PATH}/${img.filename}`;
                                    const sha = await githubCheckSha(repoPath, githubToken);
                                    if (sha) {
                                        logToScreen(`  [SKIPPED UPLOAD] File "${img.filename}" already exists on GitHub (SHA: ${sha.slice(0, 7)}). Reusing existing URL.`);
                                    } else {
                                        await githubUploadFile(img.bytes, img.filename, githubToken);
                                        logToScreen(`  Uploaded to GitHub: ${GITHUB_REPO_IMAGE_PATH}/${img.filename}`);
                                    }
                                } catch (err) {
                                    failures += 1;
                                    logToScreen(`  [ERROR] GitHub upload failed for ${img.filename}: ${err.message}`);
                                }
                            }
                            if (failures > 0) {
                                const proceedAnyway = confirm(
                                    `${failures} of ${pendingImages.length} image(s) failed to upload to GitHub. ` +
                                    `Publish anyway (those image links will be broken)?`
                                );
                                if (!proceedAnyway) {
                                    logToScreen("[System] Publishing canceled after GitHub image upload failures.");
                                    return;
                                }
                            }
                        }
                    } else {
                        // GENERAL USER MODE: Registry-based Dual Upload (Cloudinary + Google Drive)
                        logToScreen(`[System] Processing ${pendingImages.length} image(s) (Cloudinary + Google Drive Registry)...`);
                        let failures = 0;

                        for (const img of pendingImages) {
                            try {
                                const imageHash = await calculateSha256Hex(img.bytes);
                                logToScreen(`  [Checking Registry] ${img.filename} (Hash: ${imageHash.slice(0, 12)}...)`);

                                let registryResult = null;
                                try {
                                    registryResult = await checkGoogleDriveRegistry(imageHash);
                                } catch (checkErr) {
                                    console.warn("Registry lookup error:", checkErr);
                                }

                                if (registryResult && registryResult.exists) {
                                    const primaryUrl = registryResult.primaryUrl || (registryResult.providers && registryResult.providers.cloudinary) || "";
                                    const fallbackUrl = registryResult.fallbackUrl || (registryResult.providers && registryResult.providers.gdrive) || "";
                                    const usageCount = registryResult.usageCount || 2;

                                    logToScreen(`  [SKIPPED UPLOAD] Duplicate image detected for "${img.filename}":`);
                                    if (primaryUrl) logToScreen(`    ├─ Reused Primary (Cloudinary): ${primaryUrl}`);
                                    if (fallbackUrl) logToScreen(`    ├─ Reused Fallback (Google Drive): ${fallbackUrl}`);
                                    logToScreen(`    └─ Total Usage Count: ${usageCount}`);

                                    if (primaryUrl && fallbackUrl) {
                                        const replacement = `${primaryUrl}" data-backup="${fallbackUrl}" onerror="this.onerror=null;if(this.dataset.backup){this.src=this.dataset.backup;}`;
                                        articleContent = articleContent.replaceAll(img.placeholderUrl, replacement);
                                    } else if (primaryUrl) {
                                        articleContent = articleContent.replaceAll(img.placeholderUrl, primaryUrl);
                                    } else if (fallbackUrl) {
                                        articleContent = articleContent.replaceAll(img.placeholderUrl, fallbackUrl);
                                    }
                                    continue;
                                }

                                // Hash not found in registry -- upload to Cloudinary first, then Google Drive
                                let cloudinaryUrl = null;
                                let gdriveUrl = null;

                                // 1. Upload to Cloudinary
                                try {
                                    cloudinaryUrl = await cloudinaryUploadFile(img.bytes, img.filename);
                                    logToScreen(`    [1/2] Cloudinary upload successful: ${cloudinaryUrl}`);
                                } catch (err) {
                                    logToScreen(`    [WARNING] Cloudinary upload failed for ${img.filename}: ${err.message}`);
                                }

                                // 2. Upload to Google Drive via Google Apps Script (passing hash + cloudinaryUrl for registry)
                                try {
                                    gdriveUrl = await googleDriveAppsScriptUpload(img.bytes, img.filename, imageHash, cloudinaryUrl);
                                    logToScreen(`    [2/2] Google Drive upload & registry update successful: ${gdriveUrl}`);
                                } catch (err) {
                                    logToScreen(`    [WARNING] Google Drive upload failed for ${img.filename}: ${err.message}`);
                                }

                                // Handle runtime fallback if both Cloudinary and Google Drive succeeded
                                if (cloudinaryUrl && gdriveUrl) {
                                    const replacement = `${cloudinaryUrl}" data-backup="${gdriveUrl}" onerror="this.onerror=null;if(this.dataset.backup){this.src=this.dataset.backup;}`;
                                    articleContent = articleContent.replaceAll(img.placeholderUrl, replacement);
                                } else if (cloudinaryUrl) {
                                    articleContent = articleContent.replaceAll(img.placeholderUrl, cloudinaryUrl);
                                } else if (gdriveUrl) {
                                    articleContent = articleContent.replaceAll(img.placeholderUrl, gdriveUrl);
                                } else {
                                    failures += 1;
                                    logToScreen(`    [ERROR] Both Cloudinary and Google Drive uploads failed for ${img.filename}`);
                                }
                            } catch (imgErr) {
                                failures += 1;
                                logToScreen(`    [ERROR] Failed to process image ${img.filename}: ${imgErr.message}`);
                            }
                        }

                        if (failures > 0) {
                            const proceedAnyway = confirm(
                                `${failures} of ${pendingImages.length} image(s) failed to upload to both Cloudinary and Google Drive. ` +
                                `Publish anyway?`
                            );
                            if (!proceedAnyway) {
                                logToScreen("[System] Publishing canceled after image upload failures.");
                                return;
                            }
                        }
                    }
                }

                // Handle Optional Hero Image Upload (Resized 800x450 + <100KB Thumbnail)
                let uploadedHeroImage = null;
                const heroInput = document.getElementById("heroImageFileInput");
                const heroFile = heroInput && heroInput.files && heroInput.files[0];

                if (heroFile) {
                    logToScreen(`[System] Resizing & Processing Hero Image: "${heroFile.name}"...`);
                    try {
                        const { mainBytes, thumbBytes, mainSizeKb, thumbSizeKb } = await processHeroImage(heroFile);
                        logToScreen(`  ├─ Resized Main Image: 800x450 px (${mainSizeKb} KB)`);
                        logToScreen(`  └─ Generated Thumbnail: 400x225 px (${thumbSizeKb} KB - <100KB target)`);

                        const mainHash = await calculateSha256Hex(mainBytes);
                        const thumbHash = await calculateSha256Hex(thumbBytes);

                        const stem = heroFile.name.replace(/\.[^/.]+$/, "").replace(/\s+/g, '_');
                        const mainFilename = `hero_${stem}_800x450.jpg`;
                        const thumbFilename = `hero_${stem}_thumb.jpg`;

                        let mainCloudinaryUrl = "", mainGdriveUrl = "";
                        let thumbCloudinaryUrl = "", thumbGdriveUrl = "";

                        if (isSubadminRole) {
                            const githubToken = prompt("Enter GitHub token to upload Hero Image to GitHub repository:");
                            if (githubToken) {
                                // Upload main 800x450
                                const mainRepoPath = `${GITHUB_REPO_IMAGE_PATH}/${mainFilename}`;
                                if (!await githubCheckSha(mainRepoPath, githubToken)) {
                                    await githubUploadFile(mainBytes, mainFilename, githubToken);
                                }
                                mainCloudinaryUrl = GITHUB_IMAGE_BASE_URL + mainFilename;
                                mainGdriveUrl = mainCloudinaryUrl;

                                // Upload thumbnail <100KB
                                const thumbRepoPath = `${GITHUB_REPO_IMAGE_PATH}/${thumbFilename}`;
                                if (!await githubCheckSha(thumbRepoPath, githubToken)) {
                                    await githubUploadFile(thumbBytes, thumbFilename, githubToken);
                                }
                                thumbCloudinaryUrl = GITHUB_IMAGE_BASE_URL + thumbFilename;
                                thumbGdriveUrl = thumbCloudinaryUrl;

                                logToScreen(`  [Hero Image] Main & Thumbnail uploaded to GitHub repository.`);
                            }
                        } else {
                            // General User Dual Upload: Main 800x450
                            const mainReg = await checkGoogleDriveRegistry(mainHash);
                            if (mainReg && mainReg.exists) {
                                mainCloudinaryUrl = mainReg.primaryUrl || (mainReg.providers && mainReg.providers.cloudinary) || "";
                                mainGdriveUrl = mainReg.fallbackUrl || (mainReg.providers && mainReg.providers.gdrive) || "";
                                logToScreen(`  [Main Hero Image] Reused existing registry URLs.`);
                            } else {
                                mainCloudinaryUrl = await cloudinaryUploadFile(mainBytes, mainFilename);
                                mainGdriveUrl = await googleDriveAppsScriptUpload(mainBytes, mainFilename, mainHash, mainCloudinaryUrl);
                                logToScreen(`  [Main Hero Image Uploaded] 800x450 px (${mainSizeKb} KB)`);
                            }

                            // General User Dual Upload: Thumbnail <100KB
                            const thumbReg = await checkGoogleDriveRegistry(thumbHash);
                            if (thumbReg && thumbReg.exists) {
                                thumbCloudinaryUrl = thumbReg.primaryUrl || (thumbReg.providers && thumbReg.providers.cloudinary) || "";
                                thumbGdriveUrl = thumbReg.fallbackUrl || (thumbReg.providers && thumbReg.providers.gdrive) || "";
                                logToScreen(`  [Hero Thumbnail] Reused existing registry URLs.`);
                            } else {
                                thumbCloudinaryUrl = await cloudinaryUploadFile(thumbBytes, thumbFilename);
                                thumbGdriveUrl = await googleDriveAppsScriptUpload(thumbBytes, thumbFilename, thumbHash, thumbCloudinaryUrl);
                                logToScreen(`  [Hero Thumbnail Uploaded] 400x225 px (${thumbSizeKb} KB - <100KB)`);
                            }
                        }

                        uploadedHeroImage = {
                            cloudinaryUrl: mainCloudinaryUrl,
                            gdriveUrl: mainGdriveUrl,
                            filename: mainFilename,
                            thumbnailCloudinaryUrl: thumbCloudinaryUrl,
                            thumbnailGdriveUrl: thumbGdriveUrl,
                            thumbnailFilename: thumbFilename,
                            thumbSizeKb: thumbSizeKb
                        };
                    } catch (heroErr) {
                        logToScreen(`  [WARNING] Hero image processing failed: ${heroErr.message}`);
                    }
                }

                logToScreen(`[Loaded Article Content]:\n${articleContent}\n`);

                // Step 5: Initialize SuperNodes
                logToScreen("[System] Initializing SuperNodes...");
                await floCloudAPI.init(supernodesList);

                // Step 6: Construct Payload & Dispatch Request via sendGeneralData
                const articleID = floCrypto.randString(16, true);
                logToScreen("[System] Dispatching request to RanchiMall Times...");
                
                const payload = {
                    articleID: articleID,
                    title: articleTitle,
                    content: articleContent,
                    readTime: readTime,
                    contributors: contributors
                };
                if (powResult) {
                    payload.pow = powResult;
                }
                if (uploadedHeroImage) {
                    payload.heroImage = uploadedHeroImage;
                }

                updateUserProgressCard({
                    title: "Uploading images & dispatching request...",
                    subtext: "Sending payload to RanchiMall Times...",
                    percent: 90
                });

                return floCloudAPI.sendGeneralData(payload, 'publishing_requests', {
                    application: 'RM_Times',
                    receiverID: 'FF5pewfsJxyrCvg8a2C8VXefeyVvKvQxmF'
                })
                .then(res => {
                    console.log("Publication response:", res);
                    logToScreen("[System] Result:\n" + JSON.stringify(res, null, 2));
                    updateUserProgressCard({
                        title: "🎉 Article submitted successfully!",
                        subtext: "Your article request has been published to RanchiMall Times.",
                        percent: 100,
                        spinner: false,
                        isSuccess: true
                    });
                    alert("Publication request submitted successfully!");
                    return res;
                })
                .catch(err => {
                    console.error("Publication error:", err);
                    logToScreen("[Error] " + (err.message || JSON.stringify(err)));
                    updateUserProgressCard({
                        title: "Publication failed",
                        subtext: err.message || "Failed to submit publication request.",
                        percent: 100,
                        spinner: false
                    });
                    alert("Publication request failed.");
                });

            } catch (err) {
                console.error("Failed to execute publishing routine:", err);
                logToScreen("[Error] " + (err.message || JSON.stringify(err)));
            }
        }
    </script>
</body>
